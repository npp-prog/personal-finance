name: Android build

# Builds the Android app on GitHub's runners (they include the Android SDK).
#  - Always: a debug APK you can install on a phone or tablet for testing.
#  - When the signing secrets are set: a signed release AAB to upload to Google Play.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown in the Play Store (e.g. 1.0.1)'
        required: false
        default: ''
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package*.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # versionCode must increase with every Play upload; the run number always does.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('1.0.{0}', github.run_number) }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install, test and bundle the web app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Build debug APK (for testing)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Restore upload keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "path=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB (for Google Play)
        if: steps.keystore.outputs.path != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ledger-debug-apk-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload release AAB
        if: steps.keystore.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: personal-ledger-release-aab-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Summary
        run: |
          {
            echo "### Personal Ledger ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo "- Debug APK: download the **personal-ledger-debug-apk** artifact and install it on a device."
            if [ -n "${{ steps.keystore.outputs.path }}" ]; then
              echo "- Release AAB: download **personal-ledger-release-aab** and upload it in Google Play Console."
            else
              echo "- No signing secrets set, so no Play Store AAB was built. See PLAYSTORE.md, step 2."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
